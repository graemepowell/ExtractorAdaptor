name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code Validation & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check HTML Syntax
        run: npx --yes htmlhint index.html dev/index.html

      - name: Install Playwright & Browsers
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Test
        run: npx playwright test

  deploy-dev:
    name: Deploy Dev Preview
    needs: validate
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/index.html
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage /dev Directory Structure
        run: |
          mkdir -p _site/dev
          cp index.html _site/index.html
          cp dev/index.html _site/dev/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages Preview
        id: deployment
        uses: actions/deploy-pages@v4

  release-and-deploy-production:
    name: Release & Deploy Live Production
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Calculate Next Version, Update index.html & Create Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/exec @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github
          npx semantic-release

      - name: Stage Production & Dev Structure
        run: |
          mkdir -p _site/dev
          cp index.html _site/index.html
          cp dev/index.html _site/dev/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
